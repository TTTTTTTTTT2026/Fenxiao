services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      PROFILE_CREATE_TOKEN: ${PROFILE_CREATE_TOKEN}
      INTERNAL_DISTRIBUTION_TOKEN: ${INTERNAL_DISTRIBUTION_TOKEN}
      LINKY_SIGNING_SECRET: ${LINKY_SIGNING_SECRET:?LINKY_SIGNING_SECRET is required}
      LINKY_REPLAY_WINDOW_SECONDS: ${LINKY_REPLAY_WINDOW_SECONDS:-900}
      LINKY_VERIFICATION_SOURCE: ${LINKY_VERIFICATION_SOURCE:-LEGACY}
      LINKY_GUILD_PROBE_SCRIPT: ${LINKY_GUILD_PROBE_SCRIPT:-scripts/linke_guild_probe.py}
      LINKE_OAUTH_TOKEN: ${LINKE_OAUTH_TOKEN:-}
      LINKE_OAUTH_TOKEN_SECRET: ${LINKE_OAUTH_TOKEN_SECRET:-}
      MCN_LINKY_VERIFICATION_ENABLED: ${MCN_LINKY_VERIFICATION_ENABLED:-false}
      MCN_LINKY_BASE_URL: ${MCN_LINKY_BASE_URL:-}
      MCN_LINKY_CREDENTIAL_ID: ${MCN_LINKY_CREDENTIAL_ID:-}
      MCN_LINKY_HMAC_SECRET: ${MCN_LINKY_HMAC_SECRET:-}
      MCN_LINKY_CONNECT_TIMEOUT: ${MCN_LINKY_CONNECT_TIMEOUT:-5s}
      MCN_LINKY_REQUEST_TIMEOUT: ${MCN_LINKY_REQUEST_TIMEOUT:-60s}
      MCN_LINKY_REQUESTS_PER_MINUTE: ${MCN_LINKY_REQUESTS_PER_MINUTE:-10}
      PLATFORM_VERIFICATION_SOURCE: ${PLATFORM_VERIFICATION_SOURCE:-MCN}
      MCN_TIMO_VERIFICATION_ENABLED: ${MCN_TIMO_VERIFICATION_ENABLED:-false}
      MCN_TIMO_BASE_URL: ${MCN_TIMO_BASE_URL:-}
      MCN_TIMO_CREDENTIAL_ID: ${MCN_TIMO_CREDENTIAL_ID:-}
      MCN_TIMO_HMAC_SECRET: ${MCN_TIMO_HMAC_SECRET:-}
      MCN_TIMO_CONNECT_TIMEOUT: ${MCN_TIMO_CONNECT_TIMEOUT:-10s}
      MCN_TIMO_REQUEST_TIMEOUT: ${MCN_TIMO_REQUEST_TIMEOUT:-50s}
      MCN_TIMO_REQUESTS_PER_MINUTE: ${MCN_TIMO_REQUESTS_PER_MINUTE:-30}
      MCN_TIMO_RETRY_POLL_INTERVAL: ${MCN_TIMO_RETRY_POLL_INTERVAL:-30000}
      MCN_GUILD_DIRECTORY_ENABLED: ${MCN_GUILD_DIRECTORY_ENABLED:-false}
      MCN_GUILD_DIRECTORY_BASE_URL: ${MCN_GUILD_DIRECTORY_BASE_URL:-}
      MCN_GUILD_DIRECTORY_CREDENTIAL_ID: ${MCN_GUILD_DIRECTORY_CREDENTIAL_ID:-}
      MCN_GUILD_DIRECTORY_HMAC_SECRET: ${MCN_GUILD_DIRECTORY_HMAC_SECRET:-}
      MCN_GUILD_DIRECTORY_CONNECT_TIMEOUT: ${MCN_GUILD_DIRECTORY_CONNECT_TIMEOUT:-5s}
      MCN_GUILD_DIRECTORY_REQUEST_TIMEOUT: ${MCN_GUILD_DIRECTORY_REQUEST_TIMEOUT:-15s}
      MCN_GUILD_DIRECTORY_PAGE_SIZE: ${MCN_GUILD_DIRECTORY_PAGE_SIZE:-100}
      REWARD_ENGINE_ENABLED: ${REWARD_ENGINE_ENABLED:-false}
      REWARD_ENGINE_VERSION: ${REWARD_ENGINE_VERSION:-BANDEIRA_V1_DIRECT_ONLY}
      LIFECYCLE_SHADOW_ONLY: ${LIFECYCLE_SHADOW_ONLY:-true}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      ADMIN_SESSION_TTL_MINUTES: ${ADMIN_SESSION_TTL_MINUTES:-720}
      ADMIN_REMEMBERED_IDLE_DAYS: ${ADMIN_REMEMBERED_IDLE_DAYS:-7}
      ADMIN_LOGIN_WINDOW_MINUTES: ${ADMIN_LOGIN_WINDOW_MINUTES:-10}
      ADMIN_LOGIN_MAX_ATTEMPTS: ${ADMIN_LOGIN_MAX_ATTEMPTS:-5}
      ADMIN_ACCOUNT_LOCK_MINUTES: ${ADMIN_ACCOUNT_LOCK_MINUTES:-30}
      ADMIN_PASSWORD_MAX_AGE_DAYS: ${ADMIN_PASSWORD_MAX_AGE_DAYS:-90}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_DISPLAY_NAME: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:-Super Admin}
      ADMIN_BOOTSTRAP_FORCE_PASSWORD_CHANGE: ${ADMIN_BOOTSTRAP_FORCE_PASSWORD_CHANGE:-true}
      WEB_ALLOWED_ORIGINS: ${WEB_ALLOWED_ORIGINS}
      SERVER_PORT: ${SERVER_PORT:-8080}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:8088:80"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
