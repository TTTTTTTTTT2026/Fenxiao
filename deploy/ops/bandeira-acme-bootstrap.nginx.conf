# Temporary configuration for the certificate expansion step.
# Replace the existing Bandeira site only after backing it up and checking nginx -t.
server {
    listen 80;
    listen [::]:80;
    server_name bandeira.fandodo.online app.bandeira.fandodo.online partner.bandeira.fandodo.online;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bandeira.fandodo.online;
    ssl_certificate /etc/letsencrypt/live/bandeira.fandodo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bandeira.fandodo.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
