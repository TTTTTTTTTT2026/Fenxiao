spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:incentive-shadow-schema.sql,classpath:withdrawal-workflow-schema.sql,classpath:controlled-experiment-schema.sql,classpath:user-operations-schema.sql,classpath:db/migration/V85__invitation_verification_campaign.sql,classpath:db/migration/V86__add_individual_linky_binding_target.sql
app:
  distribution:
    legacy-user-token-enabled: true
    # Historical workflow fixtures exercise the disabled-by-default capability in isolation.
    real-finance:
      enabled: true
    # Legacy reward-engine fixtures exercise historical data only; production defaults closed.
    reward-engine:
      enabled: true
  linky-verification:
    # Existing Spring integration fixtures use the legacy double; production is configured separately to MCN.
    source: LEGACY
