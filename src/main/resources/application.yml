spring:
  application:
    name: fenxiao
  datasource:
    url: jdbc:mysql://localhost:3306/fenxiao?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info

fenxiao:
  distribution:
    default-freeze-days: 7

app:
  mcn-income-facts:
    # This is the continuous consumer switch. It remains false until joint read-only reconciliation and business approval.
    enabled: ${MCN_INCOME_FACTS_ENABLED:false}
    # Allows only a super-admin / finance controlled smoke endpoint; it never starts the scheduler.
    controlled-read-only-enabled: ${MCN_INCOME_FACTS_CONTROLLED_READ_ONLY_ENABLED:false}
    base-url: ${MCN_INCOME_FACTS_BASE_URL:}
    credential-id: ${MCN_INCOME_FACTS_CREDENTIAL_ID:}
    hmac-secret: ${MCN_INCOME_FACTS_HMAC_SECRET:}
    connect-timeout: ${MCN_INCOME_FACTS_CONNECT_TIMEOUT:5s}
    request-timeout: ${MCN_INCOME_FACTS_REQUEST_TIMEOUT:20s}
    page-size: ${MCN_INCOME_FACTS_PAGE_SIZE:200}
    max-pages-per-run: ${MCN_INCOME_FACTS_MAX_PAGES_PER_RUN:10}
    sync-interval: ${MCN_INCOME_FACTS_SYNC_INTERVAL:300000}
  linky-verification:
    # Production only reads Linky membership facts from the MCN authority. Local acceptance overrides this to MOCK.
    source: ${LINKY_VERIFICATION_SOURCE:MCN}
    mcn:
      # Fail closed until the independently provisioned MCN credential and HMAC secret are present.
      enabled: ${MCN_LINKY_VERIFICATION_ENABLED:true}
      base-url: ${MCN_LINKY_BASE_URL:}
      credential-id: ${MCN_LINKY_CREDENTIAL_ID:}
      hmac-secret: ${MCN_LINKY_HMAC_SECRET:}
      connect-timeout: ${MCN_LINKY_CONNECT_TIMEOUT:5s}
      request-timeout: ${MCN_LINKY_REQUEST_TIMEOUT:60s}
      requests-per-minute: ${MCN_LINKY_REQUESTS_PER_MINUTE:10}
  platform-verification:
    # Production defaults to MCN. MOCK is rejected unless the local or test profile is active.
    source: ${PLATFORM_VERIFICATION_SOURCE:MCN}
    mcn:
      timo:
        # Disabled until the BANDEIRA-only V3 secret is installed through the production secret manager.
        enabled: ${MCN_TIMO_VERIFICATION_ENABLED:false}
        base-url: ${MCN_TIMO_BASE_URL:}
        credential-id: ${MCN_TIMO_CREDENTIAL_ID:}
        hmac-secret: ${MCN_TIMO_HMAC_SECRET:}
        connect-timeout: ${MCN_TIMO_CONNECT_TIMEOUT:10s}
        request-timeout: ${MCN_TIMO_REQUEST_TIMEOUT:50s}
        requests-per-minute: ${MCN_TIMO_REQUESTS_PER_MINUTE:30}
        retry-poll-interval: ${MCN_TIMO_RETRY_POLL_INTERVAL:30000}
  platform-guild-directory:
    mcn:
      # Kept off until MCN publishes the V1 endpoint and supplies the dedicated read-only credential.
      enabled: ${MCN_GUILD_DIRECTORY_ENABLED:false}
      base-url: ${MCN_GUILD_DIRECTORY_BASE_URL:}
      credential-id: ${MCN_GUILD_DIRECTORY_CREDENTIAL_ID:}
      hmac-secret: ${MCN_GUILD_DIRECTORY_HMAC_SECRET:}
      connect-timeout: ${MCN_GUILD_DIRECTORY_CONNECT_TIMEOUT:5s}
      request-timeout: ${MCN_GUILD_DIRECTORY_REQUEST_TIMEOUT:15s}
      page-size: ${MCN_GUILD_DIRECTORY_PAGE_SIZE:100}
  distribution:
    lifecycle:
      shadow-only: ${LIFECYCLE_SHADOW_ONLY:true}
    linky-signing-secret: ${LINKY_SIGNING_SECRET:}
    linky-replay-window-seconds: ${LINKY_REPLAY_WINDOW_SECONDS:900}
    linky-guild-probe-script: ${LINKY_GUILD_PROBE_SCRIPT:scripts/linke_guild_probe.py}
    linky-oauth-token: ${LINKE_OAUTH_TOKEN:}
    linky-oauth-token-secret: ${LINKE_OAUTH_TOKEN_SECRET:}
    reward-engine:
      enabled: ${REWARD_ENGINE_ENABLED:true}
      version: ${REWARD_ENGINE_VERSION:BANDEIRA_V1_DIRECT_ONLY}
