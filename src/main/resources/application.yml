spring:
  application:
    name: fenxiao
  datasource:
    url: jdbc:mysql://localhost:3306/fenxiao?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info

fenxiao:
  distribution:
    default-freeze-days: 7

app:
  linky-verification:
    # The legacy probe remains the production default until each invitation route is mapped to an active MCN guild.
    source: ${LINKY_VERIFICATION_SOURCE:LEGACY}
    mcn:
      # Disabled by default. A production secret and explicit route mappings are both required before switching to MCN.
      enabled: ${MCN_LINKY_VERIFICATION_ENABLED:false}
      base-url: ${MCN_LINKY_BASE_URL:}
      credential-id: ${MCN_LINKY_CREDENTIAL_ID:}
      hmac-secret: ${MCN_LINKY_HMAC_SECRET:}
      connect-timeout: ${MCN_LINKY_CONNECT_TIMEOUT:5s}
      request-timeout: ${MCN_LINKY_REQUEST_TIMEOUT:60s}
      requests-per-minute: ${MCN_LINKY_REQUESTS_PER_MINUTE:10}
  platform-verification:
    # Production defaults to MCN. MOCK is rejected unless the local or test profile is active.
    source: ${PLATFORM_VERIFICATION_SOURCE:MCN}
    mcn:
      timo:
        # Disabled until the BANDEIRA-only V3 secret is installed through the production secret manager.
        enabled: ${MCN_TIMO_VERIFICATION_ENABLED:false}
        base-url: ${MCN_TIMO_BASE_URL:}
        credential-id: ${MCN_TIMO_CREDENTIAL_ID:}
        hmac-secret: ${MCN_TIMO_HMAC_SECRET:}
        connect-timeout: ${MCN_TIMO_CONNECT_TIMEOUT:10s}
        request-timeout: ${MCN_TIMO_REQUEST_TIMEOUT:50s}
        requests-per-minute: ${MCN_TIMO_REQUESTS_PER_MINUTE:30}
        retry-poll-interval: ${MCN_TIMO_RETRY_POLL_INTERVAL:30000}
  distribution:
    lifecycle:
      shadow-only: ${LIFECYCLE_SHADOW_ONLY:true}
    linky-signing-secret: ${LINKY_SIGNING_SECRET:}
    linky-replay-window-seconds: ${LINKY_REPLAY_WINDOW_SECONDS:900}
    linky-guild-probe-script: ${LINKY_GUILD_PROBE_SCRIPT:scripts/linke_guild_probe.py}
    linky-oauth-token: ${LINKE_OAUTH_TOKEN:}
    linky-oauth-token-secret: ${LINKE_OAUTH_TOKEN_SECRET:}
    reward-engine:
      enabled: ${REWARD_ENGINE_ENABLED:true}
      version: ${REWARD_ENGINE_VERSION:BANDEIRA_V1_DIRECT_ONLY}
